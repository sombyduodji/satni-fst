<script>
  // Kieli selaimen mukaan tai aiemman valinnan mukaan: fi, nb tai en (ks. site.js)
  try {
    var saved = localStorage.getItem("satni-site-lang");
    var nav = (navigator.language || "fi").toLowerCase();
    document.documentElement.lang = saved || (/^(nb|nn|no)/.test(nav) ? "nb" : /^fi/.test(nav) ? "fi" : /^se/.test(nav) ? "fi" : "en");
  } catch (e) {}
</script>
