plugins {
    id "com.android.application"
}

android {
    namespace "fi.somby.satnifst"
    compileSdk 35
    buildToolsVersion "35.0.0"  // sama kuin packaging/android/Dockerfile

    defaultConfig {
        applicationId "fi.somby.satnifst"
        minSdk 24
        targetSdk 35
        // build_apk.sh antaa nämä version.py:stä (0.7.3.20261030.6 -> 2026103006)
        versionCode((project.findProperty("satniVersionCode") ?: "1") as int)
        versionName(project.findProperty("satniVersionName") ?: "dev")
        // Sovelluksen nimi aloitusnäytössä ja sovellusvalikossa (AndroidManifest.xml: ${appLabel})
        manifestPlaceholders = [appLabel: "Sátni FST"]
        // Tekstintunnistuksen natiivikirjasto on ~11 Mt suoritintyyppiä kohden: APK:hon vain puhelimien ARM-versiot.
        // Debug-versioon (emulaattori) build_apk.sh --debug lisää x86_64:n: -PsatniAbis=x86_64,arm64-v8a.
        ndk { abiFilters.addAll((project.findProperty("satniAbis") ?: "arm64-v8a,armeabi-v7a").split(",")) }
    }
    // Natiivikirjastot pakattuina: APK on pienempi ladata, Android purkaa kirjaston asennettaessa
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    // Sama web-käyttöliittymä kuin PWA:ssa ja työpöytäversiossa (web/, sanakirja web/data/)
    sourceSets {
        main { assets.srcDirs = ["../../web", "src/main/tessassets"] }  // tessassets: OCR:n toisen luvun malli (Ocr.java)
    }
    // WebAssembly pakkaamattomana. Sanakirjan .gz-tiedoston käännös purkaa itse (ks. MainActivity.openAsset).
    androidResources {
        noCompress += ["wasm", "ogg", "traineddata"]  // ogg: DrillService soittaa suoraan APK:sta (openFd)
    }

    // Julkaisuavain (packaging/android/luo_allekirjoitusavain.sh): build_apk.sh antaa kansion, jossa on
    // satni-fst-release.jks ja keystore.properties. Avain ja salasana eivät ole versionhallinnassa.
    def signingDir = System.getenv("SATNI_SIGNING_DIR")
    def signingProps = signingDir ? file("${signingDir}/keystore.properties") : null
    signingConfigs {
        if (signingProps?.exists()) {
            release {
                def props = new Properties()
                signingProps.withInputStream { props.load(it) }
                storeFile file("${signingDir}/satni-fst-release.jks")
                storePassword props.getProperty("storePassword")
                keyAlias props.getProperty("keyAlias")
                keyPassword props.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        // Kehitysversio (build_apk.sh --debug): oma sovellustunnus ja nimi, joten se asentuu julkaistun version
        // rinnalle eikä korvaa sitä (tiedostojen jakaminen käyttää tunnusta: ${applicationId}.files)
        debug {
            applicationIdSuffix ".dev"
            manifestPlaceholders = [appLabel: "Sátni FST DEV"]
            // Julkaisuavaimella (käyttäjä 2026-11-22): debug-avaimella allekirjoitetun asennus hidastui Play Protectin
            // tarkistukseen. Vianetsintä (WebView DevTools) pysyy päällä. Kuvakkeessa DEV-merkki: src/debug/.
            if (signingProps?.exists()) {
                signingConfig signingConfigs.release
            }
        }
        // Testiversio GitHubin pre-releaseen (build_apk.sh --beta, käyttäjä 2026-11-22): julkaisuavaimella, mutta oma
        // sovellustunnus ja nimi, joten se asentuu Playn / julkaistun version rinnalle eikä korvaa sitä. Kuvake ja
        // resurssit: src/beta/ (BETA-merkki kuvakkeessa).
        beta {
            initWith release
            applicationIdSuffix ".beta"
            manifestPlaceholders = [appLabel: "Sátni FST BETA"]
            matchingFallbacks = ["release"]
            if (signingProps?.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // R8: pienempi APK (ML Kit, androidx). JS-sillan keep-säännöt: proguard-rules.pro. Testattava puhelimella
            // tekstintunnistus (SatniOcr) ennen julkaisua: virheet näkyvät vasta ajossa.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingProps?.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tekstintunnistus kuvasta (OCR) laitteella: malli on APK:ssa ("bundled"), joten se toimii ilman
    // verkkoyhteyttä ja Google Play -palveluita. Kuvat eivät lähde laitteelta.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // Toinen luku sanakirjasta puuttuville saamen sanoille (Ocr.second): Tesseract 5.5.1 + Leptonica, Apache-2.0
    implementation "cz.adaptech.tesseract4android:tesseract4android:4.9.0"
    // FileProvider: kamerasovellus tallentaa kuvan sovelluksen välimuistiin (ei CAMERA-lupaa)
    implementation "androidx.core:core:1.13.1"
    // Riippuvuudet tuovat Kotlinin peruskirjastosta eri versioita: yksi versio kaikille
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
}
