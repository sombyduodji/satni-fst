plugins {
    id "com.android.application"
}

android {
    namespace "fi.somby.satnifst"
    compileSdk 36
    buildToolsVersion "36.0.0"  // sama kuin packaging/android/Dockerfile

    defaultConfig {
        applicationId "fi.somby.satnifst"
        minSdk 24
        targetSdk 36
        // build_apk.sh antaa nämä version.py:stä (0.7.3.20261030.6 -> 2026103006)
        versionCode((project.findProperty("satniVersionCode") ?: "1") as int)
        versionName(project.findProperty("satniVersionName") ?: "dev")
        // Tekstintunnistuksen natiivikirjasto on ~11 Mt suoritintyyppiä kohden: APK:hon vain puhelimien ARM-versiot.
        // Debug-versioon (emulaattori) build_apk.sh --debug lisää x86_64:n: -PsatniAbis=x86_64,arm64-v8a.
        ndk { abiFilters.addAll((project.findProperty("satniAbis") ?: "arm64-v8a,armeabi-v7a").split(",")) }
    }
    // Kaksi versiota samasta koodista: github = APK GitHub-julkaisuun, play = Google Play (tiedostoista poistetaan
    // rahalliseen tukeen liittyvä, ks. PlayAssets). Sama applicationId ja allekirjoitusavain, joten Play-versio
    // päivittyy APK:n päälle ja päinvastoin.
    flavorDimensions "store"
    productFlavors {
        github { dimension "store" }
        play { dimension "store" }
    }
    // Natiivikirjastot pakattuina: APK on pienempi ladata, Android purkaa kirjaston asennettaessa
    packaging {
        jniLibs { useLegacyPackaging = true }
    }

    // Sama web-käyttöliittymä kuin PWA:ssa ja työpöytäversiossa (web/, sanakirja web/data/)
    sourceSets {
        main { assets.srcDirs = ["../../web"] }
    }
    // WebAssembly pakkaamattomana. Sanakirjan .gz-tiedoston käännös purkaa itse (ks. MainActivity.openAsset).
    androidResources {
        noCompress += ["wasm"]
    }

    // Julkaisuavain (packaging/android/luo_allekirjoitusavain.sh): build_apk.sh antaa kansion, jossa on
    // satni-fst-release.jks ja keystore.properties. Avain ja salasana eivät ole versionhallinnassa.
    def signingDir = System.getenv("SATNI_SIGNING_DIR")
    def signingProps = signingDir ? file("${signingDir}/keystore.properties") : null
    signingConfigs {
        if (signingProps?.exists()) {
            release {
                def props = new Properties()
                signingProps.withInputStream { props.load(it) }
                storeFile file("${signingDir}/satni-fst-release.jks")
                storePassword props.getProperty("storePassword")
                keyAlias props.getProperty("keyAlias")
                keyPassword props.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingProps?.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Tekstintunnistus kuvasta (OCR) laitteella: malli on APK:ssa ("bundled"), joten se toimii ilman
    // verkkoyhteyttä ja Google Play -palveluita. Kuvat eivät lähde laitteelta.
    implementation "com.google.mlkit:text-recognition:16.0.1"
    // FileProvider: kamerasovellus tallentaa kuvan sovelluksen välimuistiin (ei CAMERA-lupaa)
    implementation "androidx.core:core:1.13.1"
    // Riippuvuudet tuovat Kotlinin peruskirjastosta eri versioita: yksi versio kaikille
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
}

// Google Play -version web-tiedostot: rahalliseen tukeen liittyvä pois jo paketista, ei vain näkyvistä.
// Muut tukemisen tavat (virheet, ideat, saavutettavuus, kehitys) jäävät. Muutokset ohittavat web/-kansion samat tiedostot.
// Käännös epäonnistuu, jos jotain jää: näin web/-tiedostojen muutos ei voi tuoda linkkiä takaisin huomaamatta.
abstract class PlayAssets extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE) abstract ConfigurableFileCollection getSources()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        def edits = [
            "index.html": { it.replaceAll(/(?s)\s*<h3 data-i18n="supportCoffeeTitle".*?data-i18n="supportThanks"><\/p>/, "")
                              .replace("Osallistu ja tue", "Osallistu") },
            "i18n.js": { it.replaceAll(/(?s)\n\s*supportCoffeeTitle: ".*?",/, "")
                           .replaceAll(/(?s)\n\s*supportCoffee: `.*?`,/, "")
                           .replaceAll(/(?s)\n\s*supportNote: `.*?`,/, "")
                           .replaceAll(/\n\s*supportThanks: ".*?",/, "")
                           .replace('support: "Osallistu ja tue"', 'support: "Osallistu"')
                           .replace('support: "Bidra og støtt"', 'support: "Bidra"') },
            "sw.js": { it.replace(' "icons/coffee.svg",', "") },
            "styles.css": { it.replaceAll(/(?m)^\/\*[^\n]*coffee[^\n]*\n/, "")
                              .replaceAll(/(?m)^[^\n{]*coffee[^\n{]*\{[^}]*\}\n/, "") },
        ]
        def out = outputDir.get().asFile
        out.mkdirs()
        sources.files.each { file ->
            def text = edits[file.name](file.getText("UTF-8"))
            def left = (text =~ /(?i)coffee|kahvi|kaffe|supportNote|supportThanks|ja tue|og støtt/)
            if (left.find()) throw new GradleException("Play-versioon jäi tukilinkin tekstiä (${file.name}): ${left.group()}")
            new File(out, file.name).setText(text, "UTF-8")
        }
    }
}

def playAssets = tasks.register("playAssets", PlayAssets) {
    sources.from(["index.html", "i18n.js", "sw.js", "styles.css"].collect { "../../web/${it}" })
    outputDir = layout.buildDirectory.dir("generated/playAssets")
}

androidComponents {
    onVariants(selector().withFlavor("store", "play")) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(playAssets, { it.outputDir })
        variant.androidResources.ignoreAssetsPatterns.add("coffee.svg")
    }
}
